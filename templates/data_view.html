{% extends "layout.html" %}
{% block title %}天气数据看板 - 气象数据可视化平台{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/data_view.css">
{% endblock %}
{% block content %}
<div class="container main-content">
    <h1 class="dashboard-title">
        <i class="fas fa-chart-line me-2"></i>天气数据看板
    </h1>
    <!-- 筛选条件 -->
    <div class="filter-box">
        <div class="row align-items-center">
            <div class="col-md-2 mb-2 mb-md-0">
                <select id="provinceSelect" class="form-select">
                    <option value="">请选择省份</option>
                </select>
            </div>
            <div class="col-md-2 mb-2 mb-md-0">
                <select id="citySelect" class="form-select" disabled>
                    <option value="">请先选择省份</option>
                </select>
             </div>
            <div class="col-md-2 mb-2 mb-md-0">
                <input type="date" id="startDate" class="form-control" placeholder="起始日期">
            </div>
            <div class="col-md-2 mb-2 mb-md-0">
                <input type="date" id="endDate" class="form-control" placeholder="结束日期">
            </div>
            <div class="col-md-4 text-md-end">
                <button onclick="loadData()" class="btn btn-primary">
                    <i class="fas fa-filter me-1"></i>筛选
                </button>
            </div>
        </div>
    </div>
    <!-- 加载动画 -->
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <p class="mt-3 text-muted">正在加载数据...</p>
    </div>
    <!-- 数据表格 -->
    <div id="tableSection">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0"><i class="fas fa-table me-2"></i>部分气象数据表</h5>
             <button class="btn btn-outline-secondary btn-sm" onclick="exportTableData()">
                <i class="fas fa-download me-1"></i>导出数据
            </button>
        </div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>城市</th>
                        <th>日期</th>
                        <th>最高温</th>
                        <th>最低温</th>
                        <th>天气</th>
                    </tr>
                </thead>
                <tbody id="dataBody"></tbody>
            </table>
        </div>
    </div>
    <!-- 温度趋势图 -->
    <div class="chart-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0"><i class="fas fa-temperature-high me-2"></i>温度趋势图</h5>
        </div>
        <div id="tempChart" style="height: 350px;"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/data_view.js"></script>
{% endblock %}
